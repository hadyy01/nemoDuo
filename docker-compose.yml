version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: nemoduo-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  app:
    build: .
    container_name: nemoduo-app
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    volumes:
      - ./data:/app/data
    restart: unless-stopped

volumes:
  ollama_data:
